name: Inspect Paper III Zenodo PDF
on:
  pull_request:
    paths:
      - ".github/workflows/inspect-paper3-pdf.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch author-published Paper III and report provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import requests,hashlib
          rid='23219588'
          meta=requests.get('https://zenodo.org/api/records/'+rid,timeout=40).json()
          print('RECORD',meta.get('id'),meta.get('metadata',{}).get('title'))
          fs=meta.get('files')
          print('FILES',[(f.get('key'),f.get('size')) for f in fs])
          items=[f for f in fs if str(f.get('key','')).lower().endswith('.pdf')]
          if len(items)!=1: raise RuntimeError('Expected exactly one source PDF')
          f=items[0]
          url=f['links'].get('self') or f['links'].get('download')
          data=requests.get(url,timeout=90).content
          if not data.startswith(b'%PDF-'):raise RuntimeError('Zenodo response is not a PDF')
          with open('/tmp/paper3.pdf','wb') as out:out.write(data)
          print('AUTHOR_PAPER_III_SHA256',hashlib.sha256(data).hexdigest())
          print('AUTHOR_PAPER_III_BYTES',len(data))
          print('AUTHOR_PAPER_III_FILENAME',f['key'])
          PY
          pdfinfo /tmp/paper3.pdf | grep -E 'Pages:|Title:'
          pdftotext -f 1 -l 1 /tmp/paper3.pdf - | head -n 22
