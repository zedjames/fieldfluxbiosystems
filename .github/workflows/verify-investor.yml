name: Verify investor page
on:
  push:
    branches: [main]
    paths:
      - investors.html
      - assets/css/investor-stable.css
      - assets/css/fieldflux.css
      - assets/js/fieldflux-world.js
      - assets/js/fieldflux-nav-world.js
      - assets/css/fieldflux-nav-world.css
      - assets/css/fieldflux-nav-world-fixes.css
      - scripts/verify_investor_page.py
      - .github/workflows/verify-investor.yml
  pull_request:
    paths:
      - investors.html
      - assets/css/investor-stable.css
      - assets/css/fieldflux.css
      - assets/js/fieldflux-world.js
      - assets/js/fieldflux-nav-world.js
      - assets/css/fieldflux-nav-world.css
      - assets/css/fieldflux-nav-world-fixes.css
      - scripts/verify_investor_page.py
      - .github/workflows/verify-investor.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate investor page and navigation
        run: python3 scripts/verify_investor_page.py
