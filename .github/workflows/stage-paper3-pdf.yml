name: Stage Verified Paper III PDF
on:
  pull_request:
    paths:
      - ".github/workflows/stage-paper3-pdf.yml"
permissions:
  contents: write
jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Verify and stage exact source PDF on the PR branch
        shell: bash
        run: |
          python3 - <<'PY'
          import sys,hashlib
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from sync_preprint_pdfs import download_record_pdf
          data=download_record_pdf("10.5281/zenodo.23219588")
          expected="ba193ff119434c26c2047ab0de20fbd36258fc7c65eb7b363c22584d26b3b650"
          actual=hashlib.sha256(data).hexdigest()
          if actual!=expected:raise RuntimeError("Paper III SHA mismatch: "+actual)
          path=Path("research-representation-sufficiency-prospective-health.pdf")
          path.write_bytes(data)
          print("VERIFIED_PAPER3_BYTES",len(data))
          print("VERIFIED_PAPER3_SHA256",actual)
          try:
            from pypdf import PdfReader
            print("VERIFIED_PAPER3_PAGES",len(PdfReader(str(path)).pages))
          except ImportError:
            pass
          PY
          git config user.name "fieldflux-preprint-sync"
          git config user.email "contact@fieldfluxbiosystems.com"
          git add research-representation-sufficiency-prospective-health.pdf
          if git diff --cached --quiet; then
            echo "Already staged exact paper."
          else
            git commit -m "Mirror verified Paper III PDF"
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi
