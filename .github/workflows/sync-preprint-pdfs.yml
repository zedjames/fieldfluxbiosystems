name: Sync Preprint PDFs

on:
  push:
    branches: [ main ]
    paths:
      - "research/preprint-pdfs.json"
      - "scripts/sync_preprint_pdfs.py"
      - ".github/workflows/sync-preprint-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact Zenodo PDFs
        run: python3 scripts/sync_preprint_pdfs.py

      - name: Commit local reader copies
        run: |
          git config user.name "fieldflux-preprint-sync"
          git config user.email "contact@fieldfluxbiosystems.com"
          git add 'research-*.pdf'
          if git diff --cached --quiet; then
            echo "No PDF changes."
            exit 0
          fi
          git commit -m "Mirror preprint PDFs from Zenodo"

          # The publication transaction can continue while this job downloads
          # and verifies PDFs. Rebase the mirror commit onto the latest main
          # immediately before push so a concurrent site/catalog commit does not
          # turn an otherwise valid PDF sync into a non-fast-forward failure.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main update (attempt $attempt); retrying."
            sleep 2
          done
          echo "Failed to publish mirrored PDFs after 3 rebased attempts."
          exit 1
