name: Independently verify live Understanding Health Lesson 21
on:
  pull_request:
    paths:
      - ".github/workflows/verify-live-understanding-health-21.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check Lesson 21, index, forward navigation, style, Paper VI link and exact PDF
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          import ssl,time,hashlib,json,re
          origin="https://fieldfluxbiosystems.com/"
          pages={
            "understanding-health.html":["21 lessons published",'href="understanding-health-21.html"',"Can measuring a system change its Health?"],
            "understanding-health-20.html":["Continue to Lesson 21","Next: Lesson 21",'rel="next"'],
            "understanding-health-21.html":["Lesson 21","By Zed James",'id="measurement-interaction"','id="three-requirements"','id="original-versus-resulting"','id="living-systems"','id="useful-interventions"',"01 / Informative","02 / Maintaining","03 / Prospective-preserving","Before measurement","After measurement","research-constitutive-observability-prospective-health.pdf","understanding-health-21.css?v=1","23301732"],
            "assets/css/understanding-health-21.css":["ulh21-two-questions","ulh21-reversal__diagram","ulh21-three","@media(max-width:1000px)"],
            "research-constitutive-observability-prospective-health.html":["Lesson 21 · Measurement disturbance","23301732"],
            "sitemap.xml":["understanding-health-20.html","understanding-health-21.html"]
          }
          errors=[]
          for path,markers in pages.items():
            for attempt in range(12):
              try:
                with urlopen(Request(origin+path,headers={"Cache-Control":"no-cache","Pragma":"no-cache","User-Agent":"FFB-L21-LiveStudy/1.0"}),timeout=22,context=ssl.create_default_context()) as response:
                  payload=response.read();code=response.status
                text=payload.decode("utf-8","replace")
                print("LIVE",path,code,len(payload),flush=True)
                if code!=200:raise ValueError("HTTP "+str(code))
                missing=[m for m in markers if m not in text]
                if missing:raise ValueError("Missing markers "+repr(missing))
                if path=="understanding-health-21.html":
                  if text.count("<math ")!=1 or text.count("</math>")!=1:raise ValueError("Native MathML missing")
                  if text.count('class="ulh-chapter-section"')!=7:raise ValueError("Expected seven article sections")
                  if text.count('class="ulh21-reversal__state ')!=2:raise ValueError("Before/after visual not complete")
                if path=="understanding-health.html":
                  if text.count('class="ulh-lesson-card"')!=21:raise ValueError("Reading room not up to date")
                  block=text.split('<script type="application/ld+json">',1)[1].split('</script>',1)[0]
                  if len(json.loads(block).get("hasPart",[]))!=21:raise ValueError("Structured learning resources not up to date")
                break
              except Exception as exc:
                if attempt==11:errors.append(path+": "+repr(exc))
                else:time.sleep(6)
          try:
            with urlopen(Request(origin+"research-constitutive-observability-prospective-health.pdf",headers={"Cache-Control":"no-cache"}),timeout=45,context=ssl.create_default_context()) as response:
              data=response.read();status=response.status
            actual=hashlib.sha256(data).hexdigest()
            print("PAPER_VI_PDF",status,len(data),actual,flush=True)
            if status!=200 or not data.startswith(b"%PDF-") or actual!="35fef03e386aa2813da56e93bdb8b31c264dd2de8f81a85156a1cd250117f40c":errors.append("Paper VI PDF checksum mismatch")
          except Exception as exc:errors.append("Paper VI PDF: "+repr(exc))
          for e in errors:print("FAIL",e,flush=True)
          if errors:raise SystemExit(1)
          print("PASS: live Lesson 21, 21-lesson reading room, before/after illustration, responsive CSS, scholarly links and source PDF",flush=True)
          PY