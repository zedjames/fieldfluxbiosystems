name: Verify Research Catalog

on:
  push:
    branches: [ main ]
    paths:
      - "research/catalog.json"
      - "research.html"
      - "index.html"
      - "understanding-health*.html"
      - "learning/**"
      - "assets/css/understanding-health.css"
      - "assets/css/understanding-health-05.css"
      - "assets/css/understanding-health-06.css"
      - "assets/css/understanding-health-07.css"
      - "assets/css/understanding-health-08.css"
      - "assets/css/understanding-health-09.css"
      - "assets/js/understanding-health-09.js"
      - "assets/js/understanding-health-08.js"
      - "research/preprint-pdfs.json"
      - "research-representation-sufficiency-prospective-health.pdf"
      - "assets/js/understanding-health-07.js"
      - "assets/js/understanding-health.js"
      - "assets/js/understanding-health-*.js"
      - "scripts/verify_understanding_health.py"
      - "scripts/verify_understanding_health_browser.py"
      - "notebook.html"
      - "research-atlas.html"
      - "research-*.html"
      - "research-*.pdf"
      - "question-behind-our-research.html"
      - "boundary-comes-first.html"
      - "fixedness.html"
      - "algebra-before-ai.html"
      - "living-boundary.html"
      - "residue-and-residual.html"
      - "one-plus-one.html"
      - "what-is-new.html"
      - "certification-algebra.html"
      - "temperament.html"
      - "making-of-an-observable.html"
      - "make-the-signal-fail.html"
      - "scripts/verify_research_catalog.py"
      - ".github/workflows/verify-research-catalog.yml"
  pull_request:
  workflow_dispatch:

# Research publication updates often touch the catalog and several static
# projections in a short sequence. Treat those pushes as one transaction:
# cancel superseded runs, then verify only the latest main commit after a
# short quiet period. This prevents temporary intermediate states from
# generating failure notifications while preserving validation of the final
# published state.
concurrency:
  group: verify-research-catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for research publication transaction to settle
        if: github.event_name == 'push'
        id: freshness
        shell: bash
        run: |
          sleep 90
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "run_verify=true" >> "$GITHUB_OUTPUT"
            echo "This is the latest main commit; running catalog verification."
          else
            echo "run_verify=false" >> "$GITHUB_OUTPUT"
            echo "Superseded by newer main commit $latest; skipping transient-state verification."
          fi

      - name: Validate catalog, relations, and static projections
        if: github.event_name != 'push' || steps.freshness.outputs.run_verify == 'true'
        run: python3 scripts/verify_research_catalog.py

      - name: Validate guided Understanding Health lesson library
        if: github.event_name != 'push' || steps.freshness.outputs.run_verify == 'true'
        run: python3 scripts/verify_understanding_health.py

      - name: Validate lesson JavaScript syntax
        if: github.event_name != 'push' || steps.freshness.outputs.run_verify == 'true'
        run: |
          node --check assets/js/understanding-health.js
          node --check assets/js/understanding-health-03.js
          node --check assets/js/understanding-health-05.js
          node --check assets/js/understanding-health-06.js
          node --check assets/js/understanding-health-07.js
          node --check assets/js/understanding-health-08.js
          node --check assets/js/understanding-health-09.js

      - name: Validate responsive learning layout and example in Chrome
        if: github.event_name != 'push' || steps.freshness.outputs.run_verify == 'true'
        run: python3 scripts/verify_understanding_health_browser.py
